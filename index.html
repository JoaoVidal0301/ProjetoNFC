<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arena MVC</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <!-- ============================= -->
        <!-- LOGO -->
        <!-- ============================= -->

        <div class="logo">
            <img src="imagens/logomvc.png" alt="Logo Arena MVC">
        </div>


        <!-- ============================= -->
        <!-- TÍTULO -->
        <!-- ============================= -->

        <h1>
            Obrigado pela visita!
        </h1>


        <!-- ============================= -->
        <!-- MENSAGEM -->
        <!-- ============================= -->

        <p class="mensagem">
            Sua opinião é muito importante para nós!
        </p>


        <!-- ============================= -->
        <!-- OPÇÕES -->
        <!-- ============================= -->

        <div class="opcoes">


            <!-- ============================= -->
            <!-- GOOGLE -->
            <!-- ============================= -->

            <a href="https://maps.app.goo.gl/1WGDExqMnbQkCdHW9"
               target="_blank"
               rel="noopener noreferrer"
               class="opcao">

                <div class="icone-container">

                    <img src="imagens/google.png"
                         alt="Google"
                         class="icone-google">

                </div>

                <span>
                    Deixe sua avaliação no Google
                </span>

            </a>


            <!-- ============================= -->
            <!-- INSTAGRAM -->
            <!-- ============================= -->

            <a href="https://www.instagram.com/joao_vidal3/"
               target="_blank"
               rel="noopener noreferrer"
               class="opcao">

                <div class="icone-container">

                    <img src="imagens/instagram.png"
                         alt="Instagram"
                         class="icone-instagram">

                </div>

                <span>
                    Siga-nos no Instagram
                </span>

            </a>


            <!-- ============================= -->
            <!-- WHATSAPP -->
            <!-- ============================= -->

            <a href="https://wa.me/5514998471915"
               target="_blank"
               rel="noopener noreferrer"
               class="opcao">

                <div class="icone-container">

                    <img src="imagens/whatsapp.png"
                         alt="WhatsApp"
                         class="icone-whatsapp">

                </div>

                <span>
                    Fale conosco pelo WhatsApp
                </span>

            </a>


        </div>


        <!-- ============================= -->
        <!-- RODAPÉ -->
        <!-- ============================= -->

        <p class="rodape">
            Obrigado pela preferência <span>❤️</span>
        </p>

    </main>

</body>

</html>
